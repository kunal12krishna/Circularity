# Publishes website/public to GitHub Pages on every push to main that touches
# the website. One-time setup: repository Settings → Pages → Source: GitHub
# Actions. Optional: Settings → Secrets and variables → Actions → Variables →
# DOWNLOAD_URL (otherwise the latest release's Circularity.dmg is used).
name: Website
on:
  push:
    branches: [main]
    paths: ["website/**", "scripts/build-website.sh", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build the page
        env:
          DOWNLOAD_URL: ${{ vars.DOWNLOAD_URL || format('https://github.com/{0}/releases/latest/download/Circularity.dmg', github.repository) }}
        run: sh scripts/build-website.sh
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/public
      - id: deployment
        uses: actions/deploy-pages@v4
