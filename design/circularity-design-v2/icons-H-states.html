<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Menu bar H · Icon states</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#A84F00}a:hover{color:#7A3900}
</style>
</helmet>
<div style="width: 1500px; height: 420px; box-sizing: border-box; padding: 32px 40px; background: #F2EFEA; font-family: ui-rounded, 'SF Pro Rounded', -apple-system, BlinkMacSystemFont, system-ui, sans-serif; color: #1D1B18; display: flex; flex-direction: column; gap: 14px">
<div style="display: grid; grid-template-columns: 180px repeat(7, minmax(0, 1fr)); gap: 12px; font-size: 12px; font-weight: 700; color: #5E574D">
<span></span>
<sc-for list="{{states}}" as="s" hint-placeholder-count="7">
<span style="text-align: center">{{s.name}}</span>
</sc-for>
</div>
<sc-for list="{{rows}}" as="row" hint-placeholder-count="3">
<div style="display: grid; grid-template-columns: 180px repeat(7, minmax(0, 1fr)); gap: 12px; align-items: center">
<span style="font-size: 13px; font-weight: 700">{{row.label}}</span>
<sc-for list="{{row.cells}}" as="c" hint-placeholder-count="7">
<div style="height: 84px; border-radius: 12px; background: {{c.barBg}}; display: flex; align-items: center; justify-content: center">
<span style="width: 52px; height: 44px; border-radius: 9px; background: {{c.chip}}; display: flex; align-items: center; justify-content: center">
<sc-if value="{{c.isRing}}" hint-placeholder-val="{{ true }}">
<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="{{c.fg}}" stroke-width="2.4" stroke-linecap="round" opacity="{{c.op}}" role="img" aria-label="{{c.aria}}"><path d="M12 3a9 9 0 0 1 8.5 6"></path><path d="M20.8 13.5A9 9 0 0 1 12 21"></path><path d="M8.5 20.3A9 9 0 0 1 3.4 9.5"></path><circle cx="12" cy="12" r="2.2" fill="{{c.fg}}" stroke="none"></circle></svg>
</sc-if>
<sc-if value="{{c.isProgress}}" hint-placeholder-val="{{ false }}">
<svg width="32" height="32" viewBox="0 0 24 24" fill="none" role="img" aria-label="{{c.aria}}"><circle cx="12" cy="12" r="9" stroke="{{c.fg}}" stroke-opacity="0.3" stroke-width="2.4"></circle><circle cx="12" cy="12" r="9" stroke="{{c.ac}}" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="{{c.dash}}" transform="rotate(-90 12 12)"></circle><circle cx="12" cy="12" r="2.2" fill="{{c.fg}}"></circle></svg>
</sc-if>
<sc-if value="{{c.isDone}}" hint-placeholder-val="{{ false }}">
<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="{{c.ac}}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="{{c.aria}}"><circle cx="12" cy="12" r="9"></circle><path d="M8 12.5l2.7 2.7L16 9.8"></path></svg>
</sc-if>
<sc-if value="{{c.isError}}" hint-placeholder-val="{{ false }}">
<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="{{c.fg}}" stroke-width="2.4" stroke-linecap="round" role="img" aria-label="{{c.aria}}"><path d="M12 3a9 9 0 0 1 4 1"></path><path d="M20.8 13.5A9 9 0 0 1 12 21"></path><path d="M8.5 20.3A9 9 0 0 1 3.4 9.5"></path><circle cx="12" cy="12" r="2.2" fill="{{c.fg}}" stroke="none"></circle><circle cx="19" cy="5" r="4.2" fill="{{c.err}}" stroke="none"></circle><path d="M19 3.2v2.2M19 6.9v0.1" stroke="#FFFFFF" stroke-width="1.6"></path></svg>
</sc-if>
<sc-if value="{{c.isPaused}}" hint-placeholder-val="{{ false }}">
<svg width="32" height="32" viewBox="0 0 24 24" fill="none" role="img" aria-label="{{c.aria}}"><g stroke="{{c.fg}}" stroke-width="2.4" stroke-linecap="round" opacity="0.4"><path d="M12 3a9 9 0 0 1 8.5 6"></path><path d="M20.8 13.5A9 9 0 0 1 12 21"></path><path d="M8.5 20.3A9 9 0 0 1 3.4 9.5"></path></g><rect x="9.2" y="8.5" width="2" height="7" rx="1" fill="{{c.fg}}"></rect><rect x="12.8" y="8.5" width="2" height="7" rx="1" fill="{{c.fg}}"></rect></svg>
</sc-if>
</span>
</div>
</sc-for>
</div>
</sc-for>
<span style="font-size: 12px; color: #5E574D">Monochrome follows the menu bar's template tint. Colour uses the accent for progress and done, and red only for errors. Done pulses once, then returns to idle after 3 s. With Reduce Motion, nothing pulses.</span>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#FF8A00","options":["#FF8A00","#FF5E3A","#FFB020","#7C8CFF"]},"$preview":{"width":1500,"height":420}}'>
var STATES_H = [
  { id: 'idle', name: 'Idle' },
  { id: 'drag', name: 'Drag over icon' },
  { id: 'p40', name: 'Converting 40%' },
  { id: 'p85', name: 'Converting 85%' },
  { id: 'done', name: 'Done (pulse)' },
  { id: 'error', name: 'Error' },
  { id: 'paused', name: 'Paused' }
];
class Component extends DCLogic {
  renderVals() {
    var accent = this.props.accent ?? '#FF8A00';
    var C = 56.55;
    var rowsDef = [
      { label: 'Light · monochrome', barBg: '#E4E0DA', fg: '#1D1B18', ac: '#1D1B18', drag: 'rgba(0,0,0,0.12)' },
      { label: 'Dark · monochrome', barBg: '#26272C', fg: '#F2F2F2', ac: '#F2F2F2', drag: 'rgba(255,255,255,0.2)' },
      { label: 'Dark · colour', barBg: '#26272C', fg: '#F2F2F2', ac: accent, drag: accent }
    ];
    var rows = rowsDef.map(function (r) {
      return {
        label: r.label,
        cells: STATES_H.map(function (s) {
          var isDrag = s.id === 'drag';
          var colourDrag = isDrag && r.ac !== r.fg;
          var pct = s.id === 'p40' ? 0.4 : 0.85;
          return {
            barBg: r.barBg,
            chip: isDrag ? r.drag : 'transparent',
            fg: colourDrag ? '#1A1206' : r.fg,
            ac: r.ac,
            err: '#E5483D',
            op: 1,
            dash: (C * pct).toFixed(1) + ' ' + C.toFixed(1),
            isRing: s.id === 'idle' || isDrag,
            isProgress: s.id === 'p40' || s.id === 'p85',
            isDone: s.id === 'done', isError: s.id === 'error', isPaused: s.id === 'paused',
            aria: 'Circularity icon, ' + s.name
          };
        })
      };
    });
    return { states: STATES_H, rows: rows };
  }
}
</script>
</body>
</html>
